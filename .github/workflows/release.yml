name: release

# Publishes to npm via Trusted Publishing (OIDC) when a v* tag is pushed.
# No npm token exists anywhere: npmjs.com is configured to trust this exact
# repository + workflow file, and exchanges the job's OIDC token for a
# short-lived publish credential. Provenance is attached automatically.
#
# One-time setup on npmjs.com → package @tinbee/contextkit-sdk → Settings →
# Trusted Publisher → GitHub Actions:
#   owner: tinbee · repository: contextkit-sdk-node · workflow: release.yml
# The package is @tinbee/contextkit-sdk; publishConfig pins public access
# (scoped packages default to restricted).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for publish rights

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10. Pinned to
      # the 11 range so a future npm major cannot change the release under us.
      - name: npm 11 for OIDC publishing
        run: |
          set -euo pipefail
          npm install -g "npm@>=11.5.1 <12"
          npm --version
      - run: pnpm install --frozen-lockfile
      - name: Refuse a tag that does not match package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "tag v$TAG != package.json $PKG"; exit 1; }
      # npm, not pnpm: the OIDC exchange is implemented in the npm CLI. The
      # typecheck/test/build gate runs ONCE here, via package.json's
      # prepublishOnly, so a red build can never be published.
      # --provenance here, not in publishConfig: npm can only generate it inside
      # a CI provider, so pinning it in package.json breaks a manual publish.
      # Verbose so a failed OIDC exchange says WHY (npm's "oidc:" lines only
      # appear at this level). At that level npm can also echo the job's
      # short-lived OIDC JWT and bearer headers, and this is a public run log,
      # so the output is redacted before it is written. PIPESTATUS keeps
      # npm's exit code as the step's.
      - name: npm publish (provenance, verbose, redacted)
        run: |
          set -uo pipefail
          npm publish --provenance 2>&1 \
            | sed -E 's/([Aa]uthorization[":= ]+(Bearer )?)[^ "]+/\1***/g; s/(Bearer )[^ "]+/\1***/g; s/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/***JWT***/g'
          # Fail on EITHER side: a broken redactor must not pass as a clean publish.
          st=("${PIPESTATUS[@]}")
          [ "${st[1]}" -eq 0 ] || { echo "::error ::log redaction failed (sed exit ${st[1]})"; exit "${st[1]}"; }
          exit "${st[0]}"
        env:
          NPM_CONFIG_LOGLEVEL: verbose
